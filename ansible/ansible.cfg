[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
# The default callback prints a dict per task, which makes a run unreadable.
# result_format=yaml shows multi-line output as written, which matters when the
# evidence for this task IS the console output. (The old community.general.yaml
# callback was removed in community.general 12, so this is the supported way.)
result_format        = yaml
# Show the recap even for a run where nothing changed - that is precisely the
# output that proves idempotency.
display_skipped_hosts = True
interpreter_python   = auto_silent
force_color          = False

[privilege_escalation]
# Nothing here needs root: Ansible talks to the Docker API as the user running
# it. Asking for sudo that is not needed is how playbooks end up requiring
# privileges nobody audited.
become = False
