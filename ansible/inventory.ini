# =============================================================================
#  Inventory for the Blood Bank Donor Matching Portal
#
#  The target node is this machine, managed through the local Docker daemon.
#  That is a deliberate choice for a single-laptop project, and it is a ONE-LINE
#  change to make it a real remote host:
#
#      [bloodbank_nodes]
#      prod-01 ansible_host=10.0.0.21 ansible_user=deploy
#
#  Nothing in site.yml or in the roles refers to "localhost"; every task uses
#  the inventory hostname and the group variables, so switching to SSH changes
#  this file and nothing else. That property is the point of writing it this
#  way rather than hard-coding connection details into the plays.
# =============================================================================

[bloodbank_nodes]
bloodbank-node-01 ansible_connection=local

[bloodbank_nodes:vars]
# An absolute path, not "/usr/bin/env python3": Ansible exec()s the interpreter
# directly rather than through a shell, so an env-style path is taken literally
# and fails with "No such file or directory". Discovery (auto_silent in
# ansible.cfg) handles a remote host; this pins the one that has the
# community.docker collection installed.
ansible_python_interpreter={{ lookup("env", "ANSIBLE_PY") | default("/Users/ayushmayekar/miniforge3/bin/python3", true) }}
