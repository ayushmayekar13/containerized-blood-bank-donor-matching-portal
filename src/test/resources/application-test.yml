# Test profile: an in-memory database per test run, so unit tests never touch
# the developer's ./data directory or the container volume.
spring:
  datasource:
    url: jdbc:h2:mem:bloodbank-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  thymeleaf:
    cache: false

# Accounts for the test profile. Separate from the demonstration accounts so a
# change to one cannot silently break the other.
bloodbank:
  security:
    users:
      - username: admin
        password: test-admin
        role: ADMIN
      - username: staff
        password: test-staff
        role: STAFF
      - username: donor
        password: test-donor
        role: DONOR
        donor-id: 1
